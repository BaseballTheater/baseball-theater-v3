name: CI

on:
    # Every pull request is checked, whichever branch it targets: each story's pull request into
    # stage auto-merges only once `ci-passed` is green (S121). Pushes to stage (each merge) are
    # checked too; main moves only by the release workflow's fast-forward (S121), a deploy-key push
    # that does start this workflow, so main is checked against its own last passing run.
    pull_request:
    push:
        branches: [stage, main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

# S89: the checks run as separate jobs that start together, so a push learns sooner whether it
# is green. Each job sets itself up the same way (checkout, pnpm, Node from .nvmrc, install).
jobs:
    # Docs-only changes (Markdown, docs/, .claude/) skip the build, tests, browsers and Lighthouse
    # and run only the docs checks below (owner, 2026-11-07, of docs-only changes: "Things like this
    # shouldn't trigger CI."). Law P11: anything else runs all of pnpm verify. A pull request is
    # compared with its base; a push with the last commit on its branch whose CI run passed, so a
    # docs merge right after an unchecked code merge still gets the full gate. scripts/ci-changes.sh
    # decides, for CI and Deploy alike.
    changes:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
        outputs:
            code: ${{ steps.diff.outputs.code }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Does this change anything besides docs?
              id: diff
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if [ "${{ github.event_name }}" = pull_request ]; then
                      scripts/ci-changes.sh pr "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
                  else
                      # The last commit on this branch whose push run of this workflow passed.
                      checked="$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=${{ github.ref_name }}&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' || true)"
                      scripts/ci-changes.sh push "$checked" "${{ github.sha }}"
                  fi

    # What a docs-only change can break: the generated backlog (pnpm backlog:check, also the first
    # step of pnpm lint), the backlog vault's own tests (ledger, laws, index) and the format of the
    # Markdown Prettier checks (outside docs/, which .prettierignore leaves out).
    docs:
        needs: changes
        if: needs.changes.outputs.code == 'false'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 9.15.0

            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Backlog notes and generated files in sync
              run: pnpm backlog:check

            - name: Backlog vault tests
              run: pnpm test:backlog

            - name: Markdown format
              run: pnpm exec prettier --check "**/*.md"

    verify:
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 9.15.0

            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            # The one gate (S62; law P11): build (lint, then each package's typecheck
            # and build), dup:check, test:coverage and size — every law pnpm verify
            # holds also holds here.
            - name: Verify
              run: pnpm verify

            - name: OpenAPI spec is up to date
              run: pnpm api:spec --check

            - name: No breaking API changes (oasdiff)
              run: pnpm api:breaking

            - name: Upload coverage summaries
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage
                  path: "**/coverage/coverage-summary.json"
                  if-no-files-found: ignore

    # The main flows on several workers (S89), each run twice so no flow depends on another's
    # order. Browsers run only here and in the design-spec job, never in pnpm verify (law P8).
    flows:
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 9.15.0

            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Install the Playwright browser
              run: pnpm exec playwright install --with-deps chromium

            - name: Main flows (Playwright, fixtures)
              run: pnpm e2e --repeat-each=2

    # Every design-capture spec still runs in CI, without BT_DESIGN_CAPTURE, so nothing is
    # written to the tree but a spec that breaks fails the push (S89 AC 2; it caught S97's at
    # 2b4de06). Taking the captures is `pnpm design:capture`, on request.
    design-specs:
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 9.15.0

            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Install the Playwright browser
              run: pnpm exec playwright install --with-deps chromium

            - name: Design-capture specs (no captures written)
              run: pnpm e2e:design

    # Budgets on the built app (ADR-026): LCP warns over 2.5 s and fails at 5 s (owner,
    # 2026-10-29); TBT and layout shift fail over budget. Alone on its runner, so nothing else
    # shares the machine it times; it builds only the web app it serves.
    lighthouse:
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 9.15.0

            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Build the web app
              run: pnpm --filter @bt/web run build

            - name: Performance budgets (Lighthouse CI)
              run: pnpm lighthouse

    # One check that stands for all of them, for a branch rule to require (so the rule needn't
    # change when the jobs do). It passes only when the jobs this change needed ran and passed:
    # all four for code, the docs job for a docs-only change; a skipped job is fine only when the
    # change didn't need it.
    ci-passed:
        if: always()
        needs: [changes, docs, verify, flows, design-specs, lighthouse]
        runs-on: ubuntu-latest
        steps:
            - name: Every CI job this change needed passed
              env:
                  CODE: ${{ needs.changes.outputs.code }}
                  CHANGES: ${{ needs.changes.result }}
                  DOCS: ${{ needs.docs.result }}
                  VERIFY: ${{ needs.verify.result }}
                  FLOWS: ${{ needs.flows.result }}
                  DESIGN: ${{ needs.design-specs.result }}
                  LIGHTHOUSE: ${{ needs.lighthouse.result }}
              run: |
                  test "$CHANGES" = success
                  if [ "$CODE" = true ]; then
                      test "$VERIFY $FLOWS $DESIGN $LIGHTHOUSE" = "success success success success"
                  else
                      test "$CODE" = false && test "$DOCS" = success
                  fi
