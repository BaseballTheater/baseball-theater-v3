name: Deploy

# S114: Baseball Theater on Cloudflare Workers (ADR-017).
# - Every pull request that changes code gets its own preview Worker on workers.dev, and its address is
#   posted on the pull request. It runs on its own Neon branch, `preview-pr-<N>`, a copy of staging's
#   branch reset from it on every deploy, through its own Hyperdrive config, `bt-preview-pr-<N>`, so a
#   pull request's migrations never reach staging's database (issue #42; owner, 2026-11-13, asked "may I
#   change deploy.yml so each PR's preview gets its own Neon branch, deleted when the PR closes?": "Yes,
#   do that."). The Worker, config and branch are deleted when the pull request closes, and the weekly
#   Preview cleanup workflow (preview-cleanup.yml) deletes any a closed pull request left behind.
# - Every push to stage that changes code deploys staging at stage.baseball.theater (a docs-only push
#   deploys nothing), on the Neon `staging` branch: a schema-only branch that never holds a fan's data.
# - Production, at next.baseball.theater, deploys only when the owner publishes a GitHub Release
#   (S121; owner, 2026-11-07: "I think releases to main probably should use GitHub releases, if
#   that's actually possible. I want a release to be a set of PRs basically"). It checks out and
#   deploys exactly the release's tag, and a push to main deploys nothing. Each story reaches stage
#   as its own auto-merged pull request; a release is the pull requests merged into stage since the
#   last one (.github/release.yml groups them in the generated notes). Production has no approval
#   wait (S118: "we don't need that approval step"). The job names the GitHub environment
#   `production` for its secrets; the owner lets that environment deploy from `v*` tags (README).
#   Production stays at next.baseball.theater until the owner cuts baseball.theater over from
#   Elastic Beanstalk by hand (S119; owner, 2026-11-07: "Do the temporary address").
# - Once production is live, `main` is fast-forwarded to the released commit, so it mirrors what
#   production runs (owner, 2026-11-07: "2. Mirror"). Never forced: if main can't fast-forward (a
#   rollback to an older release, or main moved by hand) the job fails loudly and main stays put.
# Every deploy first runs `pnpm deploy:bootstrap` (find or create the Neon branch and the Hyperdrive
# config by name, a preview's branch reset from staging; write the Worker config and secrets), then `pnpm db:migrate` and
# `pnpm db:reapply-deletions` on its own database, and only then `wrangler deploy`, which pushes
# every Worker secret from GitHub secrets. Each step is idempotent (owner, 2026-11-05: "It should be
# idempotent so it can happen with every deployment. All the bootstrapping should be like that."),
# so a re-run changes nothing; a preview's re-run resets its branch from staging and rewrites its
# Hyperdrive config, ending as the first run did. Secrets come only from GitHub secrets; agents never run this.
# Sign-in (S116): only production has Logto's machine-to-machine app, so only the production job
# reads its secrets (LOGTO_S2S_APP_ID, LOGTO_S2S_SECRET; owner, 2026-11-07: "LOGTO_S2S_APP_ID and
# LOGTO_S2S_SECRET, go ahead"), pushes them as Worker secrets and, after deploying, sets the web
# app's sign-in and sign-out addresses with `pnpm deploy:logto`. Staging and previews read nothing
# of Logto's.

on:
    pull_request:
        types: [opened, synchronize, reopened, closed]
    push:
        branches: [stage]
    release:
        types: [published]

permissions:
    contents: read
    pull-requests: write

jobs:
    # Docs-only changes (Markdown, docs/, .claude/) skip verify (owner, 2026-11-07: "Things like
    # this shouldn't trigger CI."): a docs-only pull request gets no preview, and a docs-only push
    # to stage doesn't deploy staging either, since nothing it serves changed (owner, 2026-11-11:
    # "Can we avoid deploying when the only change was docs?", then "yeah, I like your plan"). A push
    # is compared with the last stage commit whose Deploy run passed, so code that hasn't been
    # verified and deployed there yet (a run still going, cancelled or failed) always is. A release always runs everything. scripts/ci-changes.sh decides, the same script CI asks.
    changes:
        if: github.event.action != 'closed'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
        outputs:
            code: ${{ steps.diff.outputs.code }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Does this change anything besides docs?
              id: diff
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if [ "${{ github.event_name }}" = release ]; then
                      echo "code=true" >> "$GITHUB_OUTPUT"
                  elif [ "${{ github.event_name }}" = pull_request ]; then
                      scripts/ci-changes.sh pr "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
                  else
                      # The last commit on this branch whose push run of this workflow passed.
                      checked="$(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?branch=${{ github.ref_name }}&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' || true)"
                      scripts/ci-changes.sh push "$checked" "${{ github.sha }}"
                  fi

    # The same gate CI runs (pnpm verify), plus a dry run of every env's Worker bundle.
    verify:
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 9.15.0

            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Verify
              run: pnpm verify

            - name: Build the web app
              run: pnpm --filter @bt/web run build

            - name: Dry-run every env's Worker
              run: |
                  for env in preview staging production; do
                      pnpm --filter @bt/functions exec wrangler deploy --config ../wrangler.jsonc --env "$env" --dry-run --outdir "$RUNNER_TEMP/dry-run-$env"
                  done

    # One Worker per pull request that changes code (a docs-only one gets none), on the pull request's own
    # Neon branch and Hyperdrive config (issue #42). Pull requests from forks get no secrets, so they get
    # no preview. A run can wait in the pull request's concurrency group while it closes (or a close can
    # cancel it), so it asks GitHub whether the pull request is still open first and again just before
    # deploying, and if it has closed it tears the preview down instead and stops: a closed pull
    # request's preview is never recreated.
    preview:
        if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && needs.verify.result == 'success'
        needs: [verify]
        runs-on: ubuntu-latest
        timeout-minutes: 20
        concurrency:
            group: deploy-preview-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
            NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
            NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
            BT_SESSION_KEY: ${{ secrets.BT_SESSION_KEY_STAGING }}
        steps:
            - uses: actions/checkout@v4

            - name: Is the pull request still open?
              id: open
              env:
                  GH_TOKEN: ${{ github.token }}
              run: scripts/preview-pr-open.sh ${{ github.event.pull_request.number }}

            - uses: pnpm/action-setup@v4
              with:
                  version: 9.15.0

            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: It closed, so delete its preview (Worker, Hyperdrive config, Neon branch)
              if: steps.open.outputs.open == 'false'
              run: pnpm run deploy:teardown preview --pr ${{ github.event.pull_request.number }}

            - name: Build the web app
              if: steps.open.outputs.open == 'true'
              run: pnpm --filter @bt/web run build

            - name: Bootstrap (the pull request's own Neon branch from staging, its Hyperdrive config, Worker config and secrets)
              if: steps.open.outputs.open == 'true'
              id: bootstrap
              run: pnpm run deploy:bootstrap preview --pr ${{ github.event.pull_request.number }}

            - name: Migrate the preview's database
              if: steps.open.outputs.open == 'true'
              run: pnpm db:migrate

            - name: Re-apply deletions
              if: steps.open.outputs.open == 'true'
              run: pnpm db:reapply-deletions

            - name: Is the pull request still open, just before deploying?
              if: steps.open.outputs.open == 'true'
              id: still_open
              env:
                  GH_TOKEN: ${{ github.token }}
              run: scripts/preview-pr-open.sh ${{ github.event.pull_request.number }}

            - name: Deploy the preview Worker
              if: steps.still_open.outputs.open == 'true'
              run: pnpm --filter @bt/functions exec wrangler deploy --config "${{ steps.bootstrap.outputs.config }}" --env preview --secrets-file "${{ steps.bootstrap.outputs.secrets_file }}"

            - name: It closed meanwhile, so delete its preview
              if: steps.still_open.outputs.open == 'false'
              run: pnpm run deploy:teardown preview --pr ${{ github.event.pull_request.number }}

            - name: Post the preview's address
              if: steps.still_open.outputs.open == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body "Preview for ${{ github.event.pull_request.head.sha }}, on its own database (a copy of staging's), at ${{ steps.bootstrap.outputs.origin }}"

    # A closed pull request's preview goes away: its Worker, its Hyperdrive config and its Neon branch
    # (issue #42), through `pnpm deploy:teardown`. Whatever is already gone is skipped; any other
    # failure fails the job, so nothing is left behind quietly. It shares the pull request's
    # concurrency group, so closing cancels a preview deploy still running; and if the pull request
    # was reopened while this waited, it deletes nothing (the reopen's preview run owns it).
    preview-teardown:
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 10
        # Reads the pull request's state, nothing more (the workflow's write is for the preview's comment).
        permissions:
            contents: read
            pull-requests: read
        concurrency:
            group: deploy-preview-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
            NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
            NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        steps:
            - uses: actions/checkout@v4

            - name: Was the pull request reopened meanwhile?
              id: open
              env:
                  GH_TOKEN: ${{ github.token }}
              run: scripts/preview-pr-open.sh ${{ github.event.pull_request.number }}

            - uses: pnpm/action-setup@v4
              if: steps.open.outputs.open == 'false'
              with:
                  version: 9.15.0

            - uses: actions/setup-node@v4
              if: steps.open.outputs.open == 'false'
              with:
                  node-version-file: ".nvmrc"
                  cache: pnpm

            - name: Install
              if: steps.open.outputs.open == 'false'
              run: pnpm install --frozen-lockfile

            - name: Delete the preview (Worker, Hyperdrive config, Neon branch)
              if: steps.open.outputs.open == 'false'
              run: pnpm run deploy:teardown preview --pr ${{ github.event.pull_request.number }}

    # Every push to stage that changes code: stage.baseball.theater on the Neon staging branch (bt-staging).
    staging:
        # Only when something besides docs changed since the last passing run, and verify passed;
        # never after it failed or was cancelled. A docs-only push deploys nothing.
        if: >-
            ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/stage' &&
            needs.changes.result == 'success' && needs.changes.outputs.code == 'true' && needs.verify.result == 'success' }}
        needs: [changes, verify]
        runs-on: ubuntu-latest
        timeout-minutes: 20
        concurrency:
            group: deploy-staging
            cancel-in-progress: false
        environment:
            name: staging
            url: https://stage.baseball.theater
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
            NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
            NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
            BT_SESSION_KEY: ${{ secrets.BT_SESSION_KEY_STAGING }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # The deploy-staging group runs one deploy at a time but doesn't keep push order, and a
            # docs-only push no longer redeploys the head to heal an older run landing last. So each run
            # reads the commit staging serves (bt-commit.txt, written into the build below) and deploys
            # unless staging already serves this commit or one that contains it. Deciding from what is
            # served, not from what is on stage, means a newer run that fails or is cancelled never
            # strands an older commit that passed.
            # - A 200 with a sha: compare. Read twice, a few seconds apart, so a deploy still spreading to
            #   the edge is seen; either read showing a commit containing this one skips.
            # - A 404, or a 200 without a sha (the SPA's index.html for a missing file): no marker yet
            #   (the first deploy, or a rollback to a build without it), so deploy.
            # - Anything else (no connection, a 5xx, a 408 or 429) after curl's retries: fail the step,
            #   so the run is re-run rather than deploying an older commit over a newer one blind.
            - name: Does staging already serve this commit or a newer one?
              id: served
              run: |
                  set -euo pipefail
                  git fetch --no-tags origin stage
                  contains=false
                  for attempt in 1 2; do
                      [ "$attempt" = 2 ] && sleep 10
                      status="$(curl -sS --retry 5 --max-time 10 -o "$RUNNER_TEMP/served" -w '%{http_code}' \
                          "https://stage.baseball.theater/bt-commit.txt?run=${{ github.run_id }}-$attempt")"
                      case "$status" in
                          200 | 404) ;;
                          *) echo "staging answered $status for bt-commit.txt; re-run this job" >&2; exit 1 ;;
                      esac
                      served="$(head -c 100 "$RUNNER_TEMP/served" | tr -d '[:space:]')"
                      if [ "$status" = 200 ] && [[ "$served" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${served}^{commit}" 2>/dev/null &&
                          git merge-base --is-ancestor "${{ github.sha }}" "$served"; then
                          contains=true
                          echo "staging serves $served, which already contains ${{ github.sha }}"
                      fi
                  done
                  if [ "$contains" = true ]; then
                      echo "deploy=false" >>"$GITHUB_OUTPUT"
                  else
                      echo "deploy=true" >>"$GITHUB_OUTPUT"
                  fi

            - uses: pnpm/action-setup@v4
              if: steps.served.outputs.deploy == 'true'
              with:
                  version: 9.15.0

            - uses: actions/setup-node@v4
              if: steps.served.outputs.deploy == 'true'
              with:
                  node-version-file: ".nvmrc"
                  cache: pnpm

            - name: Install
              if: steps.served.outputs.deploy == 'true'
              run: pnpm install --frozen-lockfile

            # bt-commit.txt is how the next run learns what staging serves (see above).
            - name: Build the web app
              if: steps.served.outputs.deploy == 'true'
              run: |
                  pnpm --filter @bt/web run build
                  echo "${{ github.sha }}" >web/dist/bt-commit.txt

            - name: Bootstrap (schema-only staging branch, bt-staging, Worker config and secrets)
              if: steps.served.outputs.deploy == 'true'
              id: bootstrap
              run: pnpm run deploy:bootstrap staging

            - name: Migrate the staging database
              if: steps.served.outputs.deploy == 'true'
              run: pnpm db:migrate

            - name: Re-apply deletions
              if: steps.served.outputs.deploy == 'true'
              run: pnpm db:reapply-deletions

            - name: Deploy staging
              if: steps.served.outputs.deploy == 'true'
              run: pnpm --filter @bt/functions exec wrangler deploy --config "${{ steps.bootstrap.outputs.config }}" --env staging --secrets-file "${{ steps.bootstrap.outputs.secrets_file }}"

    # next.baseball.theater (until the owner's cutover, S119), when the owner publishes a GitHub Release,
    # once verify passes on its tag (S121). The release's tag is what deploys, never a branch head.
    # Rolling back is `wrangler rollback` or re-running an older release's run (README).
    production:
        if: github.event_name == 'release' && github.event.action == 'published'
        needs: [verify]
        runs-on: ubuntu-latest
        timeout-minutes: 20
        concurrency:
            group: deploy-production
            cancel-in-progress: false
        environment:
            name: production
            url: https://next.baseball.theater
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
            NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
            NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
            BT_SESSION_KEY: ${{ secrets.BT_SESSION_KEY_PRODUCTION }}
            LOGTO_S2S_APP_ID: ${{ secrets.LOGTO_S2S_APP_ID }}
            LOGTO_S2S_SECRET: ${{ secrets.LOGTO_S2S_SECRET }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.release.tag_name }}

            - uses: pnpm/action-setup@v4
              with:
                  version: 9.15.0

            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Build the web app
              run: pnpm --filter @bt/web run build

            - name: Bootstrap (production branch, bt-production, Worker config and secrets)
              id: bootstrap
              run: pnpm run deploy:bootstrap production

            - name: Migrate the production database
              run: pnpm db:migrate

            - name: Re-apply deletions
              run: pnpm db:reapply-deletions

            - name: Deploy production
              run: pnpm --filter @bt/functions exec wrangler deploy --config "${{ steps.bootstrap.outputs.config }}" --env production --secrets-file "${{ steps.bootstrap.outputs.secrets_file }}"

            # After the Worker is live, so a Logto hiccup never holds a release back; it fails the job
            # visibly instead. Idempotent: an unchanged origin changes nothing in Logto.
            - name: Register production's Logto sign-in and sign-out addresses
              run: pnpm run deploy:logto production

    # main mirrors production (S121; owner, 2026-11-07: "2. Mirror"): once the release is live, move
    # main to the released commit, as a fast-forward only. A plain `git push` already refuses a
    # non-fast-forward; the ancestry check first makes that a clear error instead of a git message.
    # It never forces, so a rollback to an older release fails here on purpose and leaves main at
    # the newer release. The push goes over SSH with a write deploy key (`MAIN_MIRROR_KEY`, a
    # `production` environment secret), because a personal-account repo's rulesets can't list GitHub
    # Actions as a bypass actor but can list deploy keys (owner, 2026-11-07: "Yes, deploy keys is
    # there"); the `main` ruleset lists Deploy keys in its bypass list (README). Unlike the workflow
    # token, a deploy-key push does start workflows: CI runs on main once more, and this workflow
    # doesn't run on a push to main, so nothing redeploys.
    mirror-main:
        if: github.event_name == 'release' && github.event.action == 'published'
        needs: [production]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        # For MAIN_MIRROR_KEY, which only the production environment holds.
        environment: production
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.release.tag_name }}
                  fetch-depth: 0
                  ssh-key: ${{ secrets.MAIN_MIRROR_KEY }}

            - name: Fast-forward main to the released commit
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  released=$(git rev-parse "HEAD^{commit}")
                  git fetch --no-tags origin main
                  current=$(git rev-parse origin/main)
                  if [ "$current" = "$released" ]; then
                      echo "main is already at $TAG ($released)"
                      exit 0
                  fi
                  if ! git merge-base --is-ancestor "$current" "$released"; then
                      echo "::error::main ($current) is not an ancestor of $TAG ($released), so it cannot fast-forward. Production runs $TAG; main stays where it is. A rollback to an older release does this on purpose; otherwise main was changed by hand."
                      exit 1
                  fi
                  git push origin "$released:refs/heads/main"
                  echo "main fast-forwarded from $current to $TAG ($released)"
