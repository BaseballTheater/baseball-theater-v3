name: Deploy

# S114: Baseball Theater on Cloudflare Workers (ADR-017).
# - Every pull request that changes code gets its own preview Worker on workers.dev, on staging's database (owner,
#   2026-11-05: "Previews share staging db"), and its address is posted on the pull request. It is
#   deleted when the pull request closes.
# - Every push to stage deploys staging at stage.baseball.theater, on the Neon `staging` branch: a
#   schema-only branch that never holds a fan's data.
# - Production, at next.baseball.theater, deploys only when the owner publishes a GitHub Release
#   (S121; owner, 2026-11-07: "I think releases to main probably should use GitHub releases, if
#   that's actually possible. I want a release to be a set of PRs basically"). It checks out and
#   deploys exactly the release's tag, and a push to main deploys nothing. Each story reaches stage
#   as its own auto-merged pull request; a release is the pull requests merged into stage since the
#   last one (.github/release.yml groups them in the generated notes). Production has no approval
#   wait (S118: "we don't need that approval step"). The job names the GitHub environment
#   `production` for its secrets; the owner lets that environment deploy from `v*` tags (README).
#   Production stays at next.baseball.theater until the owner cuts baseball.theater over from
#   Elastic Beanstalk by hand (S119; owner, 2026-11-07: "Do the temporary address").
# - Once production is live, `main` is fast-forwarded to the released commit, so it mirrors what
#   production runs (owner, 2026-11-07: "2. Mirror"). Never forced: if main can't fast-forward (a
#   rollback to an older release, or main moved by hand) the job fails loudly and main stays put.
# Every deploy first runs `pnpm deploy:bootstrap` (find or create the Neon branch and the Hyperdrive
# config by name, write the Worker config and secrets), then `pnpm db:migrate` and
# `pnpm db:reapply-deletions` on its own database, and only then `wrangler deploy`, which pushes
# every Worker secret from GitHub secrets. Each step is idempotent (owner, 2026-11-05: "It should be
# idempotent so it can happen with every deployment. All the bootstrapping should be like that."),
# so a re-run changes nothing. Secrets come only from GitHub secrets; agents never run this.
# Sign-in (S116): only production has Logto's machine-to-machine app, so only the production job
# reads its secrets (LOGTO_S2S_APP_ID, LOGTO_S2S_SECRET; owner, 2026-11-07: "LOGTO_S2S_APP_ID and
# LOGTO_S2S_SECRET, go ahead"), pushes them as Worker secrets and, after deploying, sets the web
# app's sign-in and sign-out addresses with `pnpm deploy:logto`. Staging and previews read nothing
# of Logto's.

on:
    pull_request:
        types: [opened, synchronize, reopened, closed]
    push:
        branches: [stage]
    release:
        types: [published]

permissions:
    contents: read
    pull-requests: write

jobs:
    # Docs-only changes (Markdown, docs/, .claude/) skip verify (owner, 2026-11-07: "Things like
    # this shouldn't trigger CI."): a docs-only pull request gets no preview, and a docs-only push
    # to stage deploys staging without re-running verify. A push is compared with the last stage
    # commit whose Deploy run passed, so code that hasn't passed verify there yet always runs it
    # first. A release always runs everything. scripts/ci-changes.sh decides, the same script CI asks.
    changes:
        if: github.event.action != 'closed'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
        outputs:
            code: ${{ steps.diff.outputs.code }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Does this change anything besides docs?
              id: diff
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if [ "${{ github.event_name }}" = release ]; then
                      echo "code=true" >> "$GITHUB_OUTPUT"
                  elif [ "${{ github.event_name }}" = pull_request ]; then
                      scripts/ci-changes.sh pr "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
                  else
                      # The last commit on this branch whose push run of this workflow passed.
                      checked="$(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?branch=${{ github.ref_name }}&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' || true)"
                      scripts/ci-changes.sh push "$checked" "${{ github.sha }}"
                  fi

    # The same gate CI runs (pnpm verify), plus a dry run of every env's Worker bundle.
    verify:
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 9.15.0

            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Verify
              run: pnpm verify

            - name: Build the web app
              run: pnpm --filter @bt/web run build

            - name: Dry-run every env's Worker
              run: |
                  for env in preview staging production; do
                      pnpm --filter @bt/functions exec wrangler deploy --config ../wrangler.jsonc --env "$env" --dry-run --outdir "$RUNNER_TEMP/dry-run-$env"
                  done

    # One Worker per pull request that changes code (a docs-only one gets none), on the shared staging database (bt-staging). Pull requests from
    # forks get no secrets, so they get no preview.
    preview:
        if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && needs.verify.result == 'success'
        needs: [verify]
        runs-on: ubuntu-latest
        timeout-minutes: 20
        concurrency:
            group: deploy-preview-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
            NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
            NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
            BT_SESSION_KEY: ${{ secrets.BT_SESSION_KEY_STAGING }}
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 9.15.0

            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Build the web app
              run: pnpm --filter @bt/web run build

            - name: Bootstrap (staging branch, bt-staging, Worker config and secrets)
              id: bootstrap
              run: pnpm run deploy:bootstrap preview --pr ${{ github.event.pull_request.number }}

            - name: Migrate the staging database
              run: pnpm db:migrate

            - name: Re-apply deletions
              run: pnpm db:reapply-deletions

            - name: Deploy the preview Worker
              run: pnpm --filter @bt/functions exec wrangler deploy --config "${{ steps.bootstrap.outputs.config }}" --env preview --secrets-file "${{ steps.bootstrap.outputs.secrets_file }}"

            - name: Post the preview's address
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body "Preview for ${{ github.event.pull_request.head.sha }}, on the staging database, at ${{ steps.bootstrap.outputs.origin }}"

    # A closed pull request's Worker goes away; the staging database stays. Deleting a Worker that
    # is already gone is not a failure.
    preview-teardown:
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 9.15.0

            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Delete the preview Worker
              run: |
                  name="baseball-theater-pr-${{ github.event.pull_request.number }}"
                  if output=$(pnpm --filter @bt/functions exec wrangler delete --name "$name" --force 2>&1); then
                      echo "$output"
                  elif echo "$output" | grep -qiE "does not exist|not found|10007"; then
                      echo "$name was already deleted"
                  else
                      echo "$output"; exit 1
                  fi

    # Every push to stage: stage.baseball.theater on the Neon staging branch (bt-staging).
    staging:
        # After verify passed, or after a docs-only push skipped it; never after it failed or was
        # cancelled.
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/stage' && needs.changes.result == 'success' && (needs.verify.result == 'success' || (needs.verify.result == 'skipped' && needs.changes.outputs.code == 'false')) }}
        needs: [changes, verify]
        runs-on: ubuntu-latest
        timeout-minutes: 20
        concurrency:
            group: deploy-staging
            cancel-in-progress: false
        environment:
            name: staging
            url: https://stage.baseball.theater
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
            NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
            NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
            BT_SESSION_KEY: ${{ secrets.BT_SESSION_KEY_STAGING }}
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 9.15.0

            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Build the web app
              run: pnpm --filter @bt/web run build

            - name: Bootstrap (schema-only staging branch, bt-staging, Worker config and secrets)
              id: bootstrap
              run: pnpm run deploy:bootstrap staging

            - name: Migrate the staging database
              run: pnpm db:migrate

            - name: Re-apply deletions
              run: pnpm db:reapply-deletions

            - name: Deploy staging
              run: pnpm --filter @bt/functions exec wrangler deploy --config "${{ steps.bootstrap.outputs.config }}" --env staging --secrets-file "${{ steps.bootstrap.outputs.secrets_file }}"

    # next.baseball.theater (until the owner's cutover, S119), when the owner publishes a GitHub Release,
    # once verify passes on its tag (S121). The release's tag is what deploys, never a branch head.
    # Rolling back is `wrangler rollback` or re-running an older release's run (README).
    production:
        if: github.event_name == 'release' && github.event.action == 'published'
        needs: [verify]
        runs-on: ubuntu-latest
        timeout-minutes: 20
        concurrency:
            group: deploy-production
            cancel-in-progress: false
        environment:
            name: production
            url: https://next.baseball.theater
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
            NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
            NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
            BT_SESSION_KEY: ${{ secrets.BT_SESSION_KEY_PRODUCTION }}
            LOGTO_S2S_APP_ID: ${{ secrets.LOGTO_S2S_APP_ID }}
            LOGTO_S2S_SECRET: ${{ secrets.LOGTO_S2S_SECRET }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.release.tag_name }}

            - uses: pnpm/action-setup@v4
              with:
                  version: 9.15.0

            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Build the web app
              run: pnpm --filter @bt/web run build

            - name: Bootstrap (production branch, bt-production, Worker config and secrets)
              id: bootstrap
              run: pnpm run deploy:bootstrap production

            - name: Migrate the production database
              run: pnpm db:migrate

            - name: Re-apply deletions
              run: pnpm db:reapply-deletions

            - name: Deploy production
              run: pnpm --filter @bt/functions exec wrangler deploy --config "${{ steps.bootstrap.outputs.config }}" --env production --secrets-file "${{ steps.bootstrap.outputs.secrets_file }}"

            # After the Worker is live, so a Logto hiccup never holds a release back; it fails the job
            # visibly instead. Idempotent: an unchanged origin changes nothing in Logto.
            - name: Register production's Logto sign-in and sign-out addresses
              run: pnpm run deploy:logto production

    # main mirrors production (S121; owner, 2026-11-07: "2. Mirror"): once the release is live, move
    # main to the released commit, as a fast-forward only. A plain `git push` already refuses a
    # non-fast-forward; the ancestry check first makes that a clear error instead of a git message.
    # It never forces, so a rollback to an older release fails here on purpose and leaves main at
    # the newer release. The push goes over SSH with a write deploy key (`MAIN_MIRROR_KEY`, a
    # `production` environment secret), because a personal-account repo's rulesets can't list GitHub
    # Actions as a bypass actor but can list deploy keys (owner, 2026-11-07: "Yes, deploy keys is
    # there"); the `main` ruleset lists Deploy keys in its bypass list (README). Unlike the workflow
    # token, a deploy-key push does start workflows: CI runs on main once more, and this workflow
    # doesn't run on a push to main, so nothing redeploys.
    mirror-main:
        if: github.event_name == 'release' && github.event.action == 'published'
        needs: [production]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        # For MAIN_MIRROR_KEY, which only the production environment holds.
        environment: production
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.release.tag_name }}
                  fetch-depth: 0
                  ssh-key: ${{ secrets.MAIN_MIRROR_KEY }}

            - name: Fast-forward main to the released commit
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  released=$(git rev-parse "HEAD^{commit}")
                  git fetch --no-tags origin main
                  current=$(git rev-parse origin/main)
                  if [ "$current" = "$released" ]; then
                      echo "main is already at $TAG ($released)"
                      exit 0
                  fi
                  if ! git merge-base --is-ancestor "$current" "$released"; then
                      echo "::error::main ($current) is not an ancestor of $TAG ($released), so it cannot fast-forward. Production runs $TAG; main stays where it is. A rollback to an older release does this on purpose; otherwise main was changed by hand."
                      exit 1
                  fi
                  git push origin "$released:refs/heads/main"
                  echo "main fast-forwarded from $current to $TAG ($released)"
